<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bde9ff" />
    <meta name="description" content="纯几何图形街机小游戏《中国人能飞》。" />
    <title>中国人能飞</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="中国人能飞游戏区域">
      <canvas id="game" width="1600" height="900" aria-label="游戏画面"></canvas>

      <header class="hud" aria-live="polite">
        <h1>
          <img src="./assets/ui/title-logo.png" alt="中国人会飞" />
        </h1>
        <output id="distance" aria-label="当前最远距离">0 米</output>
        <div class="hud-actions">
          <output id="score" aria-label="当前分数">0 分</output>
          <button
            id="leaderboard-button"
            class="hud-icon-button leaderboard-button"
            type="button"
            aria-label="打开排行榜"
            aria-controls="leaderboard-dialog"
            aria-expanded="false"
          >
            <svg viewBox="0 0 28 28" aria-hidden="true">
              <rect x="2.2" y="13" width="7.4" height="11.8" rx="1.4" />
              <rect x="10.3" y="6.3" width="7.4" height="18.5" rx="1.4" />
              <rect x="18.4" y="10.1" width="7.4" height="14.7" rx="1.4" />
              <path class="podium-number" d="M14.9 10.2v6.9M12.9 11.8l2-1.6" />
            </svg>
          </button>
          <span class="settings-wrap">
            <button
              id="settings-button"
              class="hud-icon-button settings-button"
              type="button"
              aria-label="打开游戏设置"
              aria-controls="settings-dialog"
              aria-expanded="false"
            >
              <svg viewBox="0 0 28 28" aria-hidden="true">
                <g>
                  <rect x="11.7" y="1.2" width="4.6" height="7.2" rx="1.2" />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(45 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(90 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(135 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(180 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(225 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(270 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(315 14 14)"
                  />
                  <circle cx="14" cy="14" r="8.3" />
                  <circle class="gear-hole" cx="14" cy="14" r="3.4" />
                </g>
              </svg>
            </button>
            <small
              id="unlock-notice"
              class="unlock-notice"
              aria-hidden="true"
              hidden
            >
              <svg
                class="unlock-notice-tail"
                viewBox="0 0 24 20"
                aria-hidden="true"
              >
                <path d="M2 18 L12 2 L22 18" />
              </svg>
              <span>新发射装置解锁！</span>
            </small>
          </span>
        </div>
      </header>

      <section
        id="leaderboard-dialog"
        class="leaderboard-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="leaderboard-title"
        hidden
      >
        <div class="leaderboard-panel">
          <button
            id="leaderboard-close"
            class="leaderboard-close"
            type="button"
            aria-label="关闭排行榜"
          >
            ×
          </button>

          <header class="leaderboard-heading">
            <h2 id="leaderboard-title">排行榜</h2>
          </header>

          <div
            id="leaderboard-content"
            class="leaderboard-content"
            aria-live="polite"
            aria-busy="false"
          >
            <div id="leaderboard-status" class="leaderboard-status" hidden>
              <strong id="leaderboard-status-title"></strong>
              <span id="leaderboard-status-detail"></span>
              <button
                id="leaderboard-retry"
                class="leaderboard-retry"
                type="button"
                hidden
              >
                重试
              </button>
            </div>

            <div id="leaderboard-table" class="leaderboard-table" hidden>
              <div class="leaderboard-columns" aria-hidden="true">
                <span>名次</span>
                <span>玩家</span>
                <span>分数</span>
              </div>
              <ol id="leaderboard-list" class="leaderboard-list"></ol>
            </div>
          </div>

          <footer id="my-rank" class="my-rank" aria-live="polite">
            <strong class="my-rank-label">我</strong>
            <span id="my-rank-position">加载中…</span>
            <output id="my-rank-score"></output>
          </footer>
        </div>
      </section>

      <section
        id="settings-dialog"
        class="settings-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="游戏设置"
        hidden
      >
        <div class="settings-panel">
          <button
            id="settings-close"
            class="settings-close"
            type="button"
            aria-label="关闭游戏设置"
          >
            ×
          </button>

          <section class="settings-audio" aria-labelledby="settings-audio-title">
            <h2 id="settings-audio-title">声音设置</h2>

            <label class="volume-control" for="music-volume">
              <span>音乐音量</span>
              <output id="music-volume-value" for="music-volume">48%</output>
              <input
                id="music-volume"
                type="range"
                min="0"
                max="100"
                step="1"
                value="48"
              />
            </label>

            <label class="volume-control" for="effects-volume">
              <span>音效音量</span>
              <output id="effects-volume-value" for="effects-volume">72%</output>
              <input
                id="effects-volume"
                type="range"
                min="0"
                max="100"
                step="1"
                value="72"
              />
            </label>
          </section>

          <section class="launcher-picker" aria-label="击球手设置">
            <div id="launcher-grid" class="launcher-grid"></div>
            <p class="best-distance">
              历史最远飞行距离：<output id="best-distance">0米</output>
            </p>
          </section>
        </div>
      </section>

      <section id="result" class="result" aria-live="assertive" hidden>
        <span>本局得分</span>
        <strong id="result-score">0 分</strong>
        <small id="result-distance">你飞了 0 米</small>
        <p id="result-message" class="result-message"></p>
      </section>

      <section
        id="tutorial-dialog"
        class="tutorial-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="新手教程"
        hidden
      >
        <div class="tutorial-panel">
          <p class="tutorial-line">在即将落地的时候点击屏幕即可触发打水漂</p>
          <p class="tutorial-line">借此飞得更远吧！</p>
          <button
            id="tutorial-close"
            class="tutorial-close"
            type="button"
          >
            开始游戏
          </button>
        </div>
      </section>

      <section id="portrait-overlay" class="portrait-overlay" hidden>
        <div class="rotate-icon" aria-hidden="true"></div>
        <strong>请旋转为横屏</strong>
      </section>
    </main>
    <script>
      const useOfflineBundle =
        window.location.protocol === "file:" ||
        new URLSearchParams(window.location.search).has("offline");

      if (useOfflineBundle) {
        const offlineScript = document.createElement("script");
        offlineScript.src = "./offline/game.js";
        offlineScript.onerror = () => {
          document.body.innerHTML = `
            <main style="min-height:100vh;display:grid;place-items:center;background:#142033;color:#fffdf5;font:700 20px system-ui;text-align:center;padding:32px">
              <div>离线游戏文件缺失。<br><small style="font-weight:400">请在项目目录执行 npm.cmd run build 后重试。</small></div>
            </main>`;
        };
        document.body.append(offlineScript);
      }
    </script>
    <script type="module">
      const useOfflineBundle =
        window.location.protocol === "file:" ||
        new URLSearchParams(window.location.search).has("offline");

      if (!useOfflineBundle) {
        void import("./src/main.ts");
      }
    </script>
  </body>
</html>
