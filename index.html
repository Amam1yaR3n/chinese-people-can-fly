<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bde9ff" />
    <meta name="description" content="纯几何图形街机小游戏《中国人能飞》。" />
    <title>中国人能飞</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="//s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
  </head>
  <body>
    <main id="game-shell" aria-label="中国人能飞游戏区域">
      <canvas id="game" width="1600" height="900" aria-label="游戏画面"></canvas>

      <header class="hud" aria-live="polite">
        <h1>
          <img src="./assets/ui/title-logo.png" alt="中国人会飞" />
        </h1>
        <output id="distance" aria-label="当前最远距离">0 米</output>
        <div class="hud-actions">
          <button
            id="leaderboard-button"
            class="hud-icon-button leaderboard-button"
            type="button"
            aria-label="打开排行榜"
            aria-controls="leaderboard-dialog"
            aria-expanded="false"
          >
            <svg viewBox="0 0 28 28" aria-hidden="true">
              <rect x="2.2" y="13" width="7.4" height="11.8" rx="1.4" />
              <rect x="10.3" y="6.3" width="7.4" height="18.5" rx="1.4" />
              <rect x="18.4" y="10.1" width="7.4" height="14.7" rx="1.4" />
              <path class="podium-number" d="M14.9 10.2v6.9M12.9 11.8l2-1.6" />
            </svg>
          </button>
          <button
            id="audio-button"
            class="hud-icon-button audio-button"
            type="button"
            aria-label="打开声音设置"
            aria-controls="audio-dialog"
            aria-expanded="false"
          >
            <svg viewBox="0 0 28 28" aria-hidden="true">
              <path class="speaker-body" d="M3.2 10.7h5.2l6.4-5v16.6l-6.4-5H3.2z" />
              <path class="speaker-wave" d="M18.1 10.4a5.2 5.2 0 0 1 0 7.2" />
              <path class="speaker-wave" d="M21.1 7.2a9.6 9.6 0 0 1 0 13.6" />
            </svg>
          </button>
          <span class="settings-wrap">
            <button
              id="settings-button"
              class="hud-icon-button settings-button"
              type="button"
              aria-label="打开游戏设置"
              aria-controls="settings-dialog"
              aria-expanded="false"
            >
              <svg viewBox="0 0 28 28" aria-hidden="true">
                <g>
                  <rect x="11.7" y="1.2" width="4.6" height="7.2" rx="1.2" />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(45 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(90 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(135 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(180 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(225 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(270 14 14)"
                  />
                  <rect
                    x="11.7"
                    y="1.2"
                    width="4.6"
                    height="7.2"
                    rx="1.2"
                    transform="rotate(315 14 14)"
                  />
                  <circle cx="14" cy="14" r="8.3" />
                  <circle class="gear-hole" cx="14" cy="14" r="3.4" />
                </g>
              </svg>
            </button>
            <small
              id="unlock-notice"
              class="unlock-notice"
              aria-hidden="true"
              hidden
            >
              <svg
                class="unlock-notice-tail"
                viewBox="0 0 24 20"
                aria-hidden="true"
              >
                <path d="M2 18 L12 2 L22 18" />
              </svg>
              <span>新发射装置解锁！</span>
            </small>
          </span>
        </div>
      </header>

      <section
        id="leaderboard-dialog"
        class="leaderboard-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="leaderboard-title"
        hidden
      >
        <div class="leaderboard-panel">
          <button
            id="leaderboard-close"
            class="leaderboard-close"
            type="button"
            aria-label="关闭排行榜"
          >
            ×
          </button>

          <header class="leaderboard-heading">
            <h2 id="leaderboard-title">排行榜</h2>
          </header>

          <div
            id="leaderboard-content"
            class="leaderboard-content"
            aria-live="polite"
            aria-busy="false"
          >
            <div id="leaderboard-status" class="leaderboard-status" hidden>
              <strong id="leaderboard-status-title"></strong>
              <span id="leaderboard-status-detail"></span>
              <button
                id="leaderboard-retry"
                class="leaderboard-retry"
                type="button"
                hidden
              >
                重试
              </button>
            </div>

            <div id="leaderboard-table" class="leaderboard-table" hidden>
              <div class="leaderboard-columns" aria-hidden="true">
                <span>名次</span>
                <span>玩家</span>
                <span>距离</span>
              </div>
              <ol id="leaderboard-list" class="leaderboard-list"></ol>
            </div>
          </div>

          <footer id="my-rank" class="my-rank" aria-live="polite">
            <strong class="my-rank-label">我</strong>
            <span id="my-rank-position">加载中…</span>
            <output id="my-rank-distance"></output>
          </footer>
        </div>
      </section>

      <section
        id="audio-dialog"
        class="audio-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="audio-dialog-title"
        hidden
      >
        <div class="audio-panel">
          <button
            id="audio-close"
            class="audio-close"
            type="button"
            aria-label="关闭声音设置"
          >
            ×
          </button>

          <section class="audio-controls" aria-labelledby="audio-dialog-title">
            <h2 id="audio-dialog-title">声音设置</h2>

            <label class="volume-control" for="music-volume">
              <span>音乐音量</span>
              <output id="music-volume-value" for="music-volume">48%</output>
              <input
                id="music-volume"
                type="range"
                min="0"
                max="100"
                step="1"
                value="48"
              />
            </label>

            <label class="volume-control" for="effects-volume">
              <span>音效音量</span>
              <output id="effects-volume-value" for="effects-volume">72%</output>
              <input
                id="effects-volume"
                type="range"
                min="0"
                max="100"
                step="1"
                value="72"
              />
            </label>
          </section>
        </div>
      </section>

      <section
        id="settings-dialog"
        class="settings-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="游戏设置"
        hidden
      >
        <div class="settings-panel">
          <button
            id="settings-close"
            class="settings-close"
            type="button"
            aria-label="关闭游戏设置"
          >
            ×
          </button>

          <section class="creator-promo" aria-label="账号信息和推荐视频">
            <h2 class="promo-section-label">作者</h2>
            <article class="account-card">
              <div class="account-summary">
                <img
                  class="account-avatar"
                  src="./assets/ui/author-avatar.jpg"
                  alt="火山哥哥头像"
                  draggable="false"
                />
                <strong class="account-name">火山哥哥</strong>
                <button
                  id="author-home-button"
                  class="promo-action"
                  type="button"
                >
                  进入主页
                </button>
              </div>
            </article>

            <h2 class="promo-section-label">开发视频</h2>
            <article class="video-card">
              <h2 id="featured-video-title">
                我把大狗叫做成了游戏！（点击即玩）【B站AI创造公开赛】
              </h2>
              <button
                id="featured-video-button"
                class="featured-video-cover"
                type="button"
                aria-label="播放：我把大狗叫做成了游戏！（点击即玩）【B站AI创造公开赛】"
              >
                <img
                  id="featured-video-image"
                  src="./assets/ui/featured-video-cover.jpg"
                  alt=""
                  draggable="false"
                />
                <span class="video-play-icon" aria-hidden="true">
                  <svg viewBox="0 0 56 56">
                    <circle cx="28" cy="28" r="25" />
                    <path d="M23 17.5 40 28 23 38.5z" />
                  </svg>
                </span>
              </button>
            </article>

            <p
              id="promotion-status"
              class="promotion-status"
              role="status"
              aria-live="polite"
              hidden
            ></p>
          </section>

          <section class="launcher-picker" aria-label="发射装置设置">
            <div id="launcher-grid" class="launcher-grid"></div>
            <div
              id="launcher-access-status"
              class="launcher-access-status"
              role="status"
              aria-live="polite"
            >
              <span id="launcher-access-status-text"
                >正在核验视频互动与关注状态…</span
              >
              <button
                id="launcher-access-retry"
                class="launcher-access-retry"
                type="button"
                hidden
                disabled
              >
                刷新解锁状态
              </button>
            </div>
            <p class="best-distance">
              历史最远飞行距离：<output id="best-distance">0米</output>
            </p>
          </section>
        </div>
      </section>

      <section id="result" class="result" aria-live="assertive" hidden>
        <span>本局距离</span>
        <strong id="result-distance">0 米</strong>
        <p id="result-message" class="result-message"></p>
      </section>

      <section
        id="tutorial-dialog"
        class="tutorial-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="新手教程"
        hidden
      >
        <div class="tutorial-panel">
          <p class="tutorial-line">在即将落地的时候点击屏幕即可触发打水漂</p>
          <p class="tutorial-line">借此飞得更远吧！</p>
          <button
            id="tutorial-close"
            class="tutorial-close"
            type="button"
          >
            开始游戏
          </button>
        </div>
      </section>

      <section
        id="landscape-tip"
        class="landscape-tip"
        role="dialog"
        aria-modal="true"
        aria-label="横屏游玩提示"
        hidden
      >
        <div id="landscape-tip-panel" class="landscape-tip-panel" tabindex="-1">
          <p class="landscape-tip-line">建议横屏游玩，体验更佳</p>
          <svg
            class="landscape-tip-arrow"
            viewBox="0 0 120 120"
            aria-hidden="true"
            focusable="false"
          >
            <defs>
              <marker
                id="landscape-tip-arrow-head"
                viewBox="0 0 10 10"
                refX="6.5"
                refY="5"
                markerWidth="12"
                markerHeight="12"
                markerUnits="userSpaceOnUse"
                orient="auto"
              >
                <path d="M 0 1 L 9 5 L 0 9 Z" fill="#142033" />
              </marker>
            </defs>
            <g class="landscape-tip-arrow-ring">
              <path
                d="M 31.7 31.7 A 40 40 0 1 1 85.7 90.6"
                fill="none"
                stroke="#142033"
                stroke-width="7"
                stroke-linecap="round"
                marker-end="url(#landscape-tip-arrow-head)"
              />
            </g>
            <rect
              x="45"
              y="26"
              width="30"
              height="68"
              rx="8"
              fill="#fffdf5"
              stroke="#142033"
              stroke-width="4"
            />
            <rect
              x="51"
              y="32"
              width="18"
              height="2.6"
              rx="1.3"
              fill="#142033"
              opacity="0.55"
            />
            <rect
              x="54"
              y="84.5"
              width="12"
              height="2.6"
              rx="1.3"
              fill="#142033"
              opacity="0.45"
            />
          </svg>
        </div>
      </section>

    </main>
    <script vite-ignore src="./offline/game.js"></script>
  </body>
</html>
